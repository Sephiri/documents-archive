name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: documents_archive
          POSTGRES_PASSWORD: documents_archive
          POSTGRES_DB: documents_archive
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USER: documents_archive
      DB_PASSWORD: documents_archive
      DB_NAME: documents_archive

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      
      - name: Lint Python
        run: ruff check .

      - name: Check Python formatting
        run: ruff format --check .

      - name: Lint Django templates
        run: djlint templates documents/templates members/templates pages/templates --check

      - name: Django check
        run: python manage.py check

      - name: Run tests
        run: python manage.py test
