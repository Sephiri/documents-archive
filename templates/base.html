<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <title>{% block title %}Intern{% endblock %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">
  </head>
  <body class="bg-light">
    <div class="container-fluid">
      <div class="row min-vh-100">
        <aside class="col-md-3 col-lg-2 bg-white border-end p-3">
          <h1 class="h5 mb-4">Intern</h1>
          <nav class="nav flex-column gap-1">
            <a class="nav-link" href="{% url 'documents:document_list' %}">Dokumente</a>
            <a class="nav-link" href="{% url 'members:member_list' %}">Mitglieder</a>
            <a class="nav-link" href="{% url 'members:member_profile' %}">Mein Profil</a>
            <hr>
            <a class="nav-link text-muted" href="/accounts/logout/">Logout</a>
          </nav>
        </aside>
        <main class="col-md-9 col-lg-10 p-4">
          {% if messages %}
            {% for message in messages %}
              <div class="alert alert-{{ message.tags|default:'info' }}">{{ message }}</div>
            {% endfor %}
          {% endif %}
          {% block content %}{% endblock %}
        </main>
      </div>
    </div>
  </body>
</html>
