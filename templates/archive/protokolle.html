{% extends "archive/base_intern.html" %}

{% block breadcrumb_main %}Protokolle{% endblock %}
{% block breadcrumb_current %}{{ title }}{% endblock %}

{% block page_content %}
{{ documents|json_script:"documents-data" }}

<script>
const INITIAL_SELECTED_ID = {% if selected_id %}{{ selected_id }}{% else %}null{% endif %};

function protokolleView() {
    return {
        documents: [],
        selectedId: null,
        selectedDoc: null,
        searchTerm: '',
        activeFilter: null,

        init() {
            this.documents = JSON.parse(document.getElementById('documents-data').textContent);
            if (INITIAL_SELECTED_ID) {
                const doc = this.documents.find(d => d.id === INITIAL_SELECTED_ID);
                if (doc) {
                    this.selectedId = INITIAL_SELECTED_ID;
                    this.selectedDoc = { ...doc, pdf_url: `/api/files/${doc.id}/` };
                }
            }
        },

        get semesterOptions() {
            const seen = new Set();
            return this.documents
                .map(d => d.semester)
                .filter(s => { if (!s || seen.has(s)) return false; seen.add(s); return true; })
                .sort((a, b) => a.localeCompare(b, 'de'));
        },

        get yearOptions() {
            const seen = new Set();
            return this.documents
                .map(d => d.version_date ? d.version_date.split('-')[0] : null)
                .filter(y => { if (!y || seen.has(y)) return false; seen.add(y); return true; })
                .sort((a, b) => Number(b) - Number(a));
        },

        get filteredDocuments() {
            const search = this.searchTerm.trim().toLowerCase();
            return this.documents.filter(doc => {
                const matchesFilter = !this.activeFilter ||
                    (this.activeFilter.kind === 'semester'
                        ? doc.semester === this.activeFilter.value
                        : doc.version_date.startsWith(this.activeFilter.value));
                const matchesSearch = !search || doc.title.toLowerCase().includes(search);
                return matchesFilter && matchesSearch;
            });
        },

        selectDocument(doc) {
            this.selectedId = doc.id;
            this.selectedDoc = { ...doc, pdf_url: `/api/files/${doc.id}/` };
            const url = new URL(window.location);
            url.searchParams.set('doc', doc.id);
            window.history.pushState({}, '', url);
        },

        formatFileSize(bytes) {
            if (!bytes) return 'Unbekannt';
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
            return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
        },
    };
}
</script>

<div
    class="grid h-full gap-4 xl:grid-cols-[minmax(360px,1fr)_minmax(0,1.3fr)]"
    x-data="protokolleView()"
>
    <!-- Left: document list -->
    <div class="flex flex-col overflow-hidden rounded-xl border border-zinc-200 bg-white shadow-sm">
        <div class="border-b border-zinc-100 px-6 py-4">
            <h2 class="text-lg font-semibold text-zinc-900">{{ title }}</h2>
        </div>
        <div class="flex flex-1 flex-col gap-4 overflow-hidden p-4">

            <!-- Search + filter row -->
            <div class="flex items-center gap-3">
                <div class="relative w-2/3">
                    <svg class="absolute left-3 top-1/2 h-4 w-4 -translate-y-1/2 text-zinc-400" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M9 3.5a5.5 5.5 0 100 11 5.5 5.5 0 000-11zM2 9a7 7 0 1112.452 4.391l3.328 3.329a.75.75 0 11-1.06 1.06l-3.329-3.328A7 7 0 012 9z" clip-rule="evenodd"/>
                    </svg>
                    <input
                        type="search"
                        x-model="searchTerm"
                        placeholder="Suchen..."
                        class="w-full rounded-md border border-zinc-200 py-1.5 pl-9 pr-3 text-sm outline-none focus:ring-2 focus:ring-zinc-400"
                    >
                </div>

                <div class="relative" x-data="{ open: false }">
                    <button
                        @click="open = !open"
                        class="flex h-8 items-center gap-1.5 rounded-md border border-zinc-200 px-3 text-sm text-zinc-700 transition-colors hover:bg-zinc-50"
                    >
                        <svg class="h-3.5 w-3.5" viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd" d="M2.628 1.601C5.028 1.206 7.49 1 10 1s4.973.206 7.372.601a.75.75 0 01.628.74v2.288a2.25 2.25 0 01-.659 1.59l-4.682 4.683a2.25 2.25 0 00-.659 1.59v3.037c0 .684-.31 1.33-.844 1.757l-1.937 1.55A.75.75 0 018 18.25v-5.757a2.25 2.25 0 00-.659-1.591L2.659 6.22A2.25 2.25 0 012 4.629V2.34a.75.75 0 01.628-.74z" clip-rule="evenodd"/>
                        </svg>
                        Filter
                    </button>

                    <div
                        x-show="open"
                        @click.outside="open = false"
                        x-cloak
                        class="absolute left-0 top-full z-10 mt-1 w-52 rounded-md border border-zinc-200 bg-white py-1 shadow-lg"
                    >
                        <p class="px-3 py-1.5 text-xs font-semibold uppercase tracking-wider text-zinc-400">Filtern nach</p>

                        <div x-data="{ sub: false }" class="relative">
                            <button @click="sub = !sub" class="flex w-full items-center justify-between px-3 py-1.5 text-sm text-zinc-700 hover:bg-zinc-50">
                                Semester
                                <svg class="h-4 w-4 text-zinc-400" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M7.21 14.77a.75.75 0 01.02-1.06L11.168 10 7.23 6.29a.75.75 0 111.04-1.08l4.5 4.25a.75.75 0 010 1.08l-4.5 4.25a.75.75 0 01-1.06-.02z" clip-rule="evenodd"/></svg>
                            </button>
                            <div x-show="sub" x-cloak class="absolute left-full top-0 w-36 rounded-md border border-zinc-200 bg-white py-1 shadow-lg">
                                <template x-for="sem in semesterOptions" :key="sem">
                                    <button
                                        @click="activeFilter = { kind: 'semester', value: sem }; open = false"
                                        class="block w-full px-3 py-1.5 text-left text-sm text-zinc-700 hover:bg-zinc-50"
                                        x-text="sem"
                                    ></button>
                                </template>
                            </div>
                        </div>

                        <div x-data="{ sub: false }" class="relative">
                            <button @click="sub = !sub" class="flex w-full items-center justify-between px-3 py-1.5 text-sm text-zinc-700 hover:bg-zinc-50">
                                Jahr
                                <svg class="h-4 w-4 text-zinc-400" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M7.21 14.77a.75.75 0 01.02-1.06L11.168 10 7.23 6.29a.75.75 0 111.04-1.08l4.5 4.25a.75.75 0 010 1.08l-4.5 4.25a.75.75 0 01-1.06-.02z" clip-rule="evenodd"/></svg>
                            </button>
                            <div x-show="sub" x-cloak class="absolute left-full top-0 w-36 rounded-md border border-zinc-200 bg-white py-1 shadow-lg">
                                <template x-for="year in yearOptions" :key="year">
                                    <button
                                        @click="activeFilter = { kind: 'year', value: year }; open = false"
                                        class="block w-full px-3 py-1.5 text-left text-sm text-zinc-700 hover:bg-zinc-50"
                                        x-text="year"
                                    ></button>
                                </template>
                            </div>
                        </div>
                    </div>
                </div>

                <template x-if="activeFilter">
                    <div class="flex items-center gap-1.5">
                        <span class="text-sm text-zinc-500" x-text="(activeFilter.kind === 'semester' ? 'Semester' : 'Jahr') + ': ' + activeFilter.value"></span>
                        <button
                            @click="activeFilter = null"
                            class="rounded p-0.5 text-zinc-400 transition-colors hover:bg-zinc-100 hover:text-zinc-600"
                            aria-label="Filter zurücksetzen"
                        >
                            <svg class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor"><path d="M6.28 5.22a.75.75 0 00-1.06 1.06L8.94 10l-3.72 3.72a.75.75 0 101.06 1.06L10 11.06l3.72 3.72a.75.75 0 101.06-1.06L11.06 10l3.72-3.72a.75.75 0 00-1.06-1.06L10 8.94 6.28 5.22z"/></svg>
                        </button>
                    </div>
                </template>
            </div>

            <p class="text-sm text-zinc-500" x-text="filteredDocuments.length + ' Protokoll(e) gefunden'"></p>

            <div class="flex-1 overflow-auto">
                <table class="w-full text-sm">
                    <thead class="sticky top-0 bg-white">
                        <tr class="border-b border-zinc-200">
                            <th class="pb-2 text-left font-medium text-zinc-500">Titel</th>
                            <th class="w-28 pb-2 text-left font-medium text-zinc-500">Semester</th>
                        </tr>
                    </thead>
                    <tbody>
                        <template x-for="doc in filteredDocuments" :key="doc.id">
                            <tr
                                @click="selectDocument(doc)"
                                class="cursor-pointer border-b border-zinc-100 transition-colors"
                                :class="selectedId === doc.id ? 'bg-zinc-100' : 'hover:bg-zinc-50'"
                            >
                                <td class="py-2.5 pr-2 font-medium text-zinc-900" x-text="doc.title"></td>
                                <td class="py-2.5">
                                    <span class="inline-flex items-center gap-1 rounded-full border border-zinc-200 bg-zinc-50 px-2 py-0.5 text-xs text-zinc-600" x-text="doc.semester || '–'"></span>
                                </td>
                            </tr>
                        </template>
                        <template x-if="filteredDocuments.length === 0">
                            <tr>
                                <td colspan="2" class="py-6">
                                    <div class="rounded-lg border border-dashed border-zinc-300 px-4 py-6 text-sm text-zinc-400">
                                        Keine Protokolle für diese Filter gefunden.
                                    </div>
                                </td>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Right: PDF viewer -->
    <div class="flex min-h-0 flex-col overflow-hidden rounded-xl border border-zinc-200 bg-white shadow-sm">
        <template x-if="!selectedDoc">
            <div class="flex flex-1 flex-col">
                <div class="px-6 py-4">
                    <h2 class="text-lg font-semibold text-zinc-900">Kein Dokument ausgewählt</h2>
                </div>
                <div class="flex flex-1 items-center justify-center p-6 text-sm text-zinc-400">
                    Wähle links ein Dokument aus, um Details zu sehen.
                </div>
            </div>
        </template>

        <template x-if="selectedDoc">
            <div class="flex min-h-0 flex-1 flex-col">
                <div class="border-b border-zinc-100 px-6 py-4">
                    <div class="flex items-center gap-3">
                        <div class="flex h-10 w-10 shrink-0 items-center justify-center rounded-lg border border-zinc-200 bg-zinc-50 text-zinc-500">
                            <svg class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M4 4a2 2 0 012-2h4.586A2 2 0 0112 2.586L15.414 6A2 2 0 0116 7.414V16a2 2 0 01-2 2H6a2 2 0 01-2-2V4zm2 6a1 1 0 011-1h6a1 1 0 110 2H7a1 1 0 01-1-1zm1 3a1 1 0 100 2h6a1 1 0 100-2H7z" clip-rule="evenodd"/></svg>
                        </div>
                        <div class="min-w-0 flex-1">
                            <h2 class="truncate font-semibold text-zinc-900" x-text="selectedDoc.title"></h2>
                            <p class="mt-0.5 text-xs text-zinc-500"
                               x-text="'Zugriffsstatus: Alle Mitglieder · Hochgeladen: ' + selectedDoc.upload_date + ' · Größe: ' + formatFileSize(selectedDoc.file_size_bytes)">
                            </p>
                        </div>
                    </div>
                </div>
                <div class="flex min-h-0 flex-1 flex-col gap-4 p-4">
                    <div class="flex flex-1 overflow-hidden rounded-xl border border-zinc-200">
                        <iframe :src="selectedDoc.pdf_url" class="h-full w-full" :title="selectedDoc.title"></iframe>
                    </div>
                </div>
            </div>
        </template>
    </div>
</div>
{% endblock %}
