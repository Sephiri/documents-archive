<div class="single-document-view statute-document-view">
  <section class="card document-card">
    <header class="card-header document-header">
      <div class="pdf-icon" aria-hidden="true">PDF</div>
      <div class="document-heading">
        <h1 class="card-title truncate">{{ panel.document_title }}</h1>
        <div class="muted-text">
          {% for item in panel.document_meta_items %}
            {{ item }}{% if not forloop.last %} · {% endif %}
          {% endfor %}
        </div>
      </div>
    </header>

    <div class="card-content document-content">
      <div class="separator"></div>
      <div class="pdf-frame">
        <iframe src="{% url 'file-view' panel.document.id %}" title="{{ panel.document_title }}"></iframe>
      </div>
    </div>
  </section>
</div>
