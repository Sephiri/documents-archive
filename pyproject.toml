[tool.ruff]
target-version = "py312"
line-length = 150
exclude = [
    ".venv",
    "migrations",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = []

[tool.ruff.format]
quote-style = "double"

[tool.djlint]
profile = "django"
indent = 2
max_line_length = 120
ignore = "H006,H030,H031"